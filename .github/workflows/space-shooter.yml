name: Update space shooter animation

on:
  schedule:
    # Three slots a day: GitHub may delay or drop a scheduled run, and a run that
    # finds nothing new commits nothing.
    - cron: "23 4,12,20 * * *"
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Generate SVG from the contribution graph
        run: node scripts/space-shooter.mjs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_USER: ${{ github.repository_owner }}

      - name: Commit the SVG if it changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/space-shooter.svg
          git diff --cached --quiet || { git commit -m "Update space shooter animation"; git push; }
